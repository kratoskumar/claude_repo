# Publishes the app to Firebase Hosting and updates the database security rules
# whenever the app files change on main. Needs the FIREBASE_SERVICE_ACCOUNT secret (see README).
name: Deploy app

on:
  push:
    branches: [main]
    paths: ['docs/**', 'firebase/**', 'firebase.json', '.github/workflows/deploy.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Read project and owner from docs/config.js
        id: cfg
        run: |
          node --input-type=module -e "
            const c = await import('./docs/config.js');
            const fs = await import('node:fs');
            if (!c.FIREBASE.projectId || !/^[a-z0-9-]{4,40}$/.test(c.FIREBASE.projectId)) { console.log('::error::Fill FIREBASE in docs/config.js first.'); process.exit(1); }
            if (!/^[A-Za-z0-9]{10,64}$/.test(c.OWNER_UID)) { console.log('::error::Fill OWNER_UID in docs/config.js first.'); process.exit(1); }
            fs.appendFileSync(process.env.GITHUB_OUTPUT, 'project=' + c.FIREBASE.projectId + '\n' + 'owner=' + c.OWNER_UID + '\n');
          "
      - name: Put the owner's UID into the security rules
        run: |
          test "$(grep -c 'PASTE-YOUR-UID-HERE' firebase/firestore.rules)" = "1"
          sed -i "s/PASTE-YOUR-UID-HERE/${{ steps.cfg.outputs.owner }}/" firebase/firestore.rules
      - name: Deploy hosting and security rules
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret (see README)."; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx --yes firebase-tools@15.35.0 deploy --only hosting,firestore:rules --project "${{ steps.cfg.outputs.project }}" --non-interactive
          rm -f "$RUNNER_TEMP/sa.json"
