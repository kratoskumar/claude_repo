# Hourly health check: compares usage with the free-plan limits, checks the app's certificate and
# domain expiry, opens a GitHub issue and sends a phone push (ntfy) when something needs attention,
# and pings a dead-man's switch (healthchecks.io) that alerts if these runs stop.
# The repo is public: the ntfy topic and the ping address are secrets, and the logs carry no names or IDs.
name: Monitor

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write  # only for a tiny heartbeat commit that keeps this schedule from being paused
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Check the app
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          OWNER_LOGIN: ${{ github.repository_owner }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          HEALTHCHECK_URL: ${{ secrets.HEALTHCHECK_URL }}
        run: node scripts/monitor.mjs
